version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: fcp-postgres
    environment:
      POSTGRES_USER: ${FCP_DB_USER}
      POSTGRES_PASSWORD: ${FCP_DB_PASSWORD}
      POSTGRES_DB: ${FCP_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: fcp-keycloak
    environment:
      KEYCLOAK_ADMIN: ${FCP_KC_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${FCP_KC_PASSWORD}
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./docker/keycloak/fcp-realm.json:/opt/keycloak/data/import/realm.json:ro
    restart: unless-stopped

volumes:
  pgdata:
