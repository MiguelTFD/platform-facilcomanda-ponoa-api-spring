server:
  port: 8081

spring:
  application:
    name: platform-facilcomanda-ponoa-api-spring

  rabbitmq:
    listener:
      simple:
        prefetch: 1

  datasource:
    url: jdbc:postgresql://localhost:5432/${FCP_DB_NAME}
    username: ${FCP_DB_USER}
    password: ${FCP_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FacilComandaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/fcp-realm
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

  mail:
    host: smtp.myprovider.com
    port: 587
    username: ${FCP_SMTP_USER}
    password: ${FCP_SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.security: INFO

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  tax-api:
    base-url: ${TAX_API_BASE_URL:https://miapi.cloud/v1}
    token: ${TAX_API_TOKEN:}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
