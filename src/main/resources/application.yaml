server:
  port: 8081

spring:
  application:
    name: platform-facilcomanda-ponoa-api-spring

  rabbitmq:
    host: ${FCP_RABBIT_HOST:localhost}
    port: ${FCP_RABBIT_PORT:5672}
    username: ${FCP_RABBIT_USER:guest}
    password: ${FCP_RABBIT_PASSWORD:guest}
    listener:
      simple:
        prefetch: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms

  datasource:
    url: jdbc:postgresql://${FCP_DB_HOST:localhost}:${FCP_DB_PORT:5432}/${FCP_DB_NAME:fcp_db}
    username: ${FCP_DB_USER:postgres}
    password: ${FCP_DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: FacilComandaHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 300000
      max-lifetime: 1800000
      leak-detection-threshold: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/fcp-realm}
          jwk-set-uri: ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs


  mail:
    host: ${FCP_SMTP_HOST:smtp.myprovider.com}
    port: ${FCP_SMTP_PORT:587}
    username: ${FCP_SMTP_USER:}
    password: ${FCP_SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: true

logging:
  level:
    org.springframework.jdbc.core.JdbcTemplate: DEBUG
    org.springframework.security: INFO

app:
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
  tax-api:
    base-url: ${TAX_API_BASE_URL:https://miapi.cloud/v1}
    token: ${TAX_API_TOKEN:}
    connect-timeout-ms: 2000
    read-timeout-ms: 3000
